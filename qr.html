<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code สำหรับพิมพ์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;500&display=swap">
<style>
  :root{--ink:#14211F;--accent:#1D7262;--line:#D5DDDA;--display:"Mitr","Sarabun",system-ui,sans-serif;--body:"Sarabun",system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:#EEF2F0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
  .bar{max-width:820px;margin:0 auto;padding:20px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .bar p{margin:0;max-width:52ch}
  .bar button{border:0;border-radius:12px;background:var(--accent);color:#fff;font-family:var(--display);font-size:17px;padding:12px 20px;cursor:pointer}
  .sheet{max-width:820px;margin:0 auto 32px;padding:0 16px;display:grid;gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;break-inside:avoid}
  .card canvas{width:170px;height:170px;image-rendering:pixelated}
  .card h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 6px}
  .card p{margin:0 0 6px}
  .steps{margin:8px 0 0;padding-left:20px}
  .url{font-size:13px;color:#56656A;word-break:break-all}
  .tiny{display:flex;gap:6px;margin-top:8px}
  .tiny img{width:44px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
  @media (max-width:520px){.card{grid-template-columns:1fr;justify-items:center;text-align:center}.tiny{justify-content:center}}
  @media print{body{background:#fff}.bar{display:none}.card{border:1.5px dashed #9AA8A3;border-radius:0}.sheet{max-width:none}}
</style>
</head>
<body>
<div class="bar">
  <p>ป้ายนี้สร้าง QR Code จากที่อยู่เว็บที่คุณเปิดอยู่ตอนนี้ พิมพ์แล้วตัดไปติดในคู่มือ ข้างภาพปกของแต่ละเรื่อง หรือติดที่หน้าแรกของเล่ม</p>
  <button type="button" onclick="window.print()">พิมพ์</button>
</div>
<div class="sheet" id="sheet"></div>
<script src="lib/qrcode.js"></script>
<script>
  const url = new URL('./', location.href).href;
  const items = [
    ['สแกนเพื่อดูสื่อ AR', 'เบาหวานและไตในผู้สูงอายุ'],
    ['เรื่องที่ 1', 'โรคเบาหวานชนิดที่ 2 ในผู้สูงอายุ'],
    ['เรื่องที่ 2', 'โรคแทรกซ้อนทางไตจากเบาหวาน'],
    ['เรื่องที่ 3', 'การจัดการตนเองและครอบครัวเพื่อฟื้นฟูไต']
  ];
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  const n = qr.getModuleCount(), cell = 8, q = 4, size = (n + q * 2) * cell;
  document.getElementById('sheet').innerHTML = items.map(([a, b], i) => `
    <section class="card">
      <canvas width="${size}" height="${size}" data-q></canvas>
      <div>
        <h2>${a}</h2><p>${b}</p>
        <ol class="steps"><li>สแกน QR Code นี้ด้วยกล้องมือถือ</li><li>กด <b>เริ่มส่องกล้อง</b> แล้วกด <b>อนุญาต</b></li><li>ส่องภาพปกในคู่มือ ให้เห็นทั้งภาพ</li></ol>
        ${i === 0 ? `<div class="tiny"><img src="markers/m1.png" alt=""><img src="markers/m2.png" alt=""><img src="markers/m3.png" alt=""></div>` : ''}
        <p class="url">${url}</p>
      </div>
    </section>`).join('');
  document.querySelectorAll('canvas[data-q]').forEach(c => {
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) g.fillRect((k + q) * cell, (r + q) * cell, cell, cell);
  });
</script>
</body>
</html>
